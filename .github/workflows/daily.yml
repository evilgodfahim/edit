name: Daily Feed

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Run main.py (daily only)
        run: python main.py --daily-only

      - name: Ensure required files exist
        run: |
          if [ ! -f daily_feed.xml ]; then
            echo '<rss version="2.0"><channel><title>Daily Feed</title></channel></rss>' > daily_feed.xml
          fi
          if [ ! -f seen_ids.json ]; then
            echo '{"seen_ids": {}}' > seen_ids.json
          fi

      - name: Commit & push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_feed.xml seen_ids.json *.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update daily feed"
            git push
          fi